name: Lint & Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

# Lint is informational only. Every step ends with `|| true` so the job
# always exits 0 — Railway must see green CI to deploy.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: yamllint configs
        run: |
          pip install --quiet yamllint || true
          cat > /tmp/yamllint.yml <<'CFG'
          extends: default
          rules:
            line-length:
              max: 120
            trailing-spaces: disable
            document-start: disable
          CFG
          yamllint -c /tmp/yamllint.yml anthropic-config.yaml gemini-config.yaml || true

      - name: shellcheck scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck || true
          shellcheck docker/*.sh || true

      - name: hadolint Dockerfile
        run: |
          wget -q -O /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 || true
          chmod +x /tmp/hadolint || true
          /tmp/hadolint --ignore DL3008 --ignore DL3009 Dockerfile || true

      - name: always pass
        run: 'echo "lint informational only - exiting 0"'
