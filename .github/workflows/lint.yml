name: Lint & Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

# Lint findings are informational. We mark each linter as
# `continue-on-error: true` so transient warnings don't block deploys
# (Railway treats CI failure as "skip deployment").

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate YAML
        continue-on-error: true
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: |
            anthropic-config.yaml
            gemini-config.yaml
          strict: false
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
              trailing-spaces: disable
              document-start: disable

      - name: Lint shell scripts
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck docker/*.sh || true

      - name: Lint Dockerfile
        continue-on-error: true
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3009
